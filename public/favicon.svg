<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>CSMA Cognitive Eye Mark</title>
  <desc>A refined C-shaped cognitive mark with an inner eye, representing cognitive intelligence, collaborative systems, and insight.</desc>

  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Outer C-shaped cognitive orbit -->
  <path
    d="M382 132C348 96 304 78 254 78C154 78 76 156 76 256C76 356 154 434 254 434C305 434 350 415 383 379"
    stroke="url(#cStroke)"
    stroke-width="46"
    stroke-linecap="round"
  />

  <!-- Inner soft orbit echo -->
  <path
    d="M346 174C323 152 292 140 257 140C192 140 140 191 140 256C140 321 192 372 257 372C292 372 323 360 346 338"
    stroke="rgba(255,255,255,0.18)"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- Cognitive eye outline -->
  <path
    d="M144 256C176 201 216 176 256 176C296 176 336 201 368 256C336 311 296 336 256 336C216 336 176 311 144 256Z"
    fill="rgba(5,24,36,0.38)"
    stroke="url(#eyeStroke)"
    stroke-width="24"
    stroke-linejoin="round"
  />

  <!-- Inner eye field -->
  <path
    d="M194 256C214 226 234 214 256 214C278 214 298 226 318 256C298 286 278 298 256 298C234 298 214 286 194 256Z"
    fill="rgba(248,254,255,0.12)"
    stroke="rgba(255,255,255,0.42)"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- Cognition core / pupil -->
  <circle cx="256" cy="256" r="44" fill="#F8FEFF"/>
  <circle cx="256" cy="256" r="20" fill="#0B3F4A"/>
  <circle cx="241" cy="241" r="8" fill="#B7FFF5"/>

  <!-- Four subtle CSMA nodes -->
  <circle cx="147" cy="148" r="14" fill="#B7FFF5"/>
  <circle cx="365" cy="148" r="14" fill="#8FE7DE"/>
  <circle cx="147" cy="364" r="14" fill="#8FE7DE"/>
  <circle cx="365" cy="364" r="14" fill="#B7FFF5"/>

  <!-- Grounding line -->
  <path
    d="M212 415H300"
    stroke="#B7FFF5"
    stroke-width="16"
    stroke-linecap="round"
    opacity="0.72"
  />

  <defs>
    <linearGradient id="bg" x1="48" y1="44" x2="464" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061F32"/>
      <stop offset="0.48" stop-color="#0B4653"/>
      <stop offset="1" stop-color="#16796E"/>
    </linearGradient>

    <linearGradient id="cStroke" x1="76" y1="78" x2="394" y2="434" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2FFFF"/>
      <stop offset="0.48" stop-color="#8FE7DE"/>
      <stop offset="1" stop-color="#25BFB4"/>
    </linearGradient>

    <linearGradient id="eyeStroke" x1="144" y1="176" x2="368" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FFFF"/>
      <stop offset="0.55" stop-color="#8FE7DE"/>
      <stop offset="1" stop-color="#2CC7BC"/>
    </linearGradient>
  </defs>
</svg>